<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry Joseph Umoh | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Utility Bar with Live Abuja Time & Social Connect -->
    <div class="top-utility-bar">
        <div class="utility-left">
            <span id="liveClock"><i class="fas fa-clock"></i> Abuja, Nigeria 🇳🇬</span>
        </div>
        <div class="utility-right">
            <a href="mailto:umohjerryjoseph@gmail.com"><i class="fas fa-envelope"></i> Email Me</a>
            <a href="https://github.com/Umoh-jerry-joseph/COS-106-Introduction-to-Web-Technologies" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            <a href="https://www.linkedin.com/in/jerryumoh/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
        </div>
    </div>

    <header>
        <div class="logo"><span class="highlight">Jerry</span>Umoh</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html">Academic Planner</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
            <div class="hamburger"><i class="fas fa-bars"></i></div>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2 class="section-title">Get In Touch</h2>
            <p class="section-subtitle">Have questions or want to collaborate? Send me a message below.</p>
            
            <div class="contact-container">
                <form id="contactForm" novalidate>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name">
                        <small class="error-msg" id="nameError"></small>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email address">
                        <small class="error-msg" id="emailError"></small>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number (Digits Only)</label>
                        <input type="tel" id="phone" placeholder="e.g., 09034006404">
                        <small class="error-msg" id="phoneError"></small>
                    </div>
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>
                        <small class="error-msg" id="messageError"></small>
                    </div>
                    <button type="submit" class="btn primary-btn submit-btn">Send Message</button>
                    <p id="successMessage" class="success-msg"></p>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jerry Joseph Umoh. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
